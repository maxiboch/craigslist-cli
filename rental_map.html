<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>MakeMaxiMove — Rental Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
        }
        
        #map {
            flex: 1;
            min-width: 0;
        }
        
        #sidebar {
            width: 390px;
            overflow-y: auto;
            background: #16213e;
            border-left: 1px solid #0f3460;
            padding: 12px;
        }
        
        #sidebar h2 {
            color: #e94560;
            margin-bottom: 4px;
            font-size: 1.1em;
        }
        
        .subtitle {
            font-size: 0.75em;
            color: #78909c;
            margin-bottom: 10px;
        }
        
        .filters {
            margin-bottom: 12px;
            padding: 10px;
            background: #0f3460;
            border-radius: 8px;
        }
        
        .filters label {
            display: block;
            margin: 4px 0;
            font-size: 0.85em;
            color: #a0c4ff;
        }
        
        .filters select,
        .filters input[type=range] {
            background: #1a1a2e;
            color: #e0e0e0;
            border: 1px solid #334;
            padding: 4px 6px;
            border-radius: 4px;
            width: 100%;
            margin-top: 2px;
        }
        
        .filters .row {
            display: flex;
            gap: 8px;
            align-items: end;
        }
        
        .filters .row>label {
            flex: 1;
        }
        
        .filters .checks {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        
        .filters .checks label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8em;
        }
        
        #cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .card {
            background: #0f3460;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all .2s;
            border-left: 4px solid #555;
            position: relative;
        }
        
        .card:hover {
            background: #1a3a6e;
            transform: translateX(2px);
        }
        
        .card.direct {
            border-left-color: #00e676;
        }
        
        .card.unclear {
            border-left-color: #ffab40;
        }
        
        .card.broker {
            border-left-color: #78909c;
        }
        
        .card .name {
            font-weight: 600;
            font-size: 0.9em;
            color: #fff;
            padding-right: 50px;
        }
        
        .card .meta {
            font-size: 0.8em;
            color: #90caf9;
            margin-top: 3px;
        }
        
        .card .storage-line {
            font-size: 0.78em;
            color: #ce93d8;
            margin-top: 2px;
        }
        
        .card .tags {
            margin-top: 4px;
        }
        
        .card .tag {
            display: inline-block;
            font-size: 0.7em;
            padding: 2px 6px;
            border-radius: 10px;
            margin-right: 4px;
            margin-top: 2px;
        }
        
        .tag-direct {
            background: #1b5e20;
            color: #a5d6a7;
        }
        
        .tag-storage {
            background: #4a148c;
            color: #ce93d8;
        }
        
        .tag-coastal {
            background: #01579b;
            color: #81d4fa;
        }
        
        .tag-si {
            background: #bf360c;
            color: #ffab91;
        }
        
        .tag-li {
            background: #33691e;
            color: #aed581;
        }
        
        .tag-nj {
            background: #e65100;
            color: #ffcc80;
        }
        
        .tag-queens {
            background: #4a148c;
            color: #b39ddb;
        }
        
        .tag-westchester {
            background: #1a237e;
            color: #9fa8da;
        }
        
        .tag-brooklyn {
            background: #880e4f;
            color: #f48fb1;
        }
        

        .friendly-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            font-weight: 700;
            overflow: hidden;
        }
        .friendly-badge .flag-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(
                #5BCEFA 0deg 72deg,
                #F5A9B8 72deg 144deg,
                #FFFFFF 144deg 216deg,
                #F5A9B8 216deg 288deg,
                #5BCEFA 288deg 360deg
            );
            opacity: 0.85;
        }
        .friendly-badge .score-num {
            position: relative;
            z-index: 1;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        .scores-row {
            display: flex;
            gap: 3px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .score-pill {
            font-size: 0.65em;
            padding: 1px 5px;
            border-radius: 8px;
            background: #1a1a2e;
            border: 1px solid #334;
            color: #90caf9;
            white-space: nowrap;
        }
        .score-pill.good { background: #1b5e20; color: #a5d6a7; border-color: #2e7d32; }
        .score-pill.mid  { background: #4a4a00; color: #fdd835; border-color: #827717; }
        .score-pill.bad  { background: #4a1010; color: #ef9a9a; border-color: #b71c1c; }

        .weights-panel { background:#111827; border:1px solid #334; border-radius:8px; padding:8px; margin-bottom:10px; }
        .weights-toggle { color:#90caf9; font-size:0.8em; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
        .weights-toggle:hover { color:#fff; }
        .weights-body { display:none; margin-top:6px; }
        .weights-body.open { display:block; }
        .weight-row { display:flex; align-items:center; gap:6px; margin:4px 0; font-size:0.75em; color:#a0c4ff; }
        .weight-row .w-label { width:70px; }
        .weight-row .w-val { width:28px; text-align:center; font-weight:700; color:#ffd600; font-size:1.1em; }
        .weight-btn { width:22px; height:22px; border-radius:50%; border:1px solid #334; background:#1a1a2e; color:#90caf9; cursor:pointer; font-size:0.9em; display:flex; align-items:center; justify-content:center; line-height:1; }
        .weight-btn:hover { background:#0f3460; border-color:#90caf9; }
        .weight-bar { flex:1; height:6px; background:#1a1a2e; border-radius:3px; overflow:hidden; }
        .weight-bar-fill { height:100%; background:#e94560; border-radius:3px; transition:width .15s; }
        .weights-reset { font-size:0.7em; color:#78909c; cursor:pointer; margin-top:4px; text-align:right; }
        .weights-reset:hover { color:#e94560; }


        
        .interest-row {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            align-items: center;
        }
        
        .interest-btn {
            font-size: 0.75em;
            padding: 2px 7px;
            border-radius: 10px;
            border: 1px solid #334;
            background: #1a1a2e;
            color: #78909c;
            cursor: pointer;
            transition: all .15s;
        }
        
        .interest-btn:hover {
            border-color: #90caf9;
        }
        
        .interest-btn.active-hot {
            background: #b71c1c;
            color: #fff;
            border-color: #e53935;
        }
        
        .interest-btn.active-interested {
            background: #1b5e20;
            color: #a5d6a7;
            border-color: #2e7d32;
        }
        
        .interest-btn.active-maybe {
            background: #4a4a00;
            color: #fdd835;
            border-color: #f9a825;
        }
        
        .interest-btn.active-pass {
            background: #37474f;
            color: #90a4ae;
            border-color: #546e7a;
        }
        
        .status-select {
            font-size: 0.72em;
            padding: 1px 4px;
            border-radius: 4px;
            background: #1a1a2e;
            color: #90caf9;
            border: 1px solid #334;
            margin-left: auto;
        }
        
        .notes-input {
            font-size: 0.72em;
            width: 100%;
            margin-top: 4px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #0a1628;
            color: #e0e0e0;
            border: 1px solid #334;
        }
        
        .notes-input::placeholder {
            color: #546e7a;
        }
        
        .card.pass-card {
            opacity: 0.4;
        }
        
        .export-btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            margin-top: 8px;
            width: 100%;
        }
        
        .export-btn:hover {
            background: #c62848;
        }
        
        .submit-box { background:#111827; border:1px solid #334; border-radius:8px; padding:8px; margin-bottom:10px; }
        .submit-box h4 { color:#90caf9; font-size:0.8em; margin-bottom:5px; }
        .submit-box input { width:100%; padding:5px 8px; border-radius:4px; background:#0a1628; color:#e0e0e0; border:1px solid #334; font-size:0.78em; margin-bottom:4px; }
        .submit-box input::placeholder { color:#546e7a; }
        .submit-box button { background:#4caf50; color:#fff; border:none; padding:4px 12px; border-radius:4px; cursor:pointer; font-size:0.75em; width:100%; }
        .submit-box button:hover { background:#388e3c; }
        .submit-box .submit-msg { font-size:0.7em; color:#4caf50; margin-top:3px; display:none; }
        .pending-card { background:#1a1a2e; border:1px dashed #546e7a; border-radius:8px; padding:8px 10px; margin-bottom:6px; }
        .pending-card .name { color:#90caf9; font-size:0.82em; font-weight:500; }
        .pending-card .meta { color:#78909c; font-size:0.72em; margin-top:2px; }
        .pending-card a { color:#e94560; font-size:0.75em; text-decoration:none; }

        .filter-interest {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        
        .filter-interest label {
            font-size: 0.75em;
            color: #a0c4ff;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        
        .sort-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        .sort-btn {
            background: #1a1a2e;
            color: #90caf9;
            border: 1px solid #334;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75em;
        }
        
        .sort-btn.active {
            background: #e94560;
            color: #fff;
            border-color: #e94560;
        }
        
        #count {
            font-size: 0.8em;
            color: #78909c;
            margin-bottom: 8px;
        }
        
        a.link {
            color: #64b5f6;
            text-decoration: none;
            font-size: 0.8em;
        }
        
        a.link:hover {
            text-decoration: underline;
        }
        
        .legend {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0;
            font-size: 0.72em;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1.5px solid #fff;
        }
        
        .friendly-legend {
            margin: 6px 0 10px;
            font-size: 0.72em;
            color: #90caf9;
        }
        
        .friendly-legend span {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 0.7em;
            font-weight: 700;
            margin-right: 2px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="sidebar">
        <h2>Rental Picks</h2>
        <div class="subtitle">Loading...</div>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background:#00e676"></div> Direct</div>
            <div class="legend-item">
                <div class="legend-dot" style="background:#42a5f5"></div> Allie</div>
            <div class="legend-item">
                <div class="legend-dot" style="background:#00bcd4"></div> Coastal</div>
            <div class="legend-item">
                <div class="legend-dot" style="background:#e040fb"></div> BK/Queens</div>
            <div class="legend-item">
                <div class="legend-dot" style="background:#ffab40"></div> Other</div>
        </div>
        <div class="friendly-legend">
            Trans-friendliness ring:
            <span style="background:#1b5e20;color:#a5d6a7">5</span>
            <span style="background:#2e7d32;color:#a5d6a7">4</span>
            <span style="background:#f9a825;color:#333">3</span>
            <span style="background:#e65100;color:#fff">2</span>
        </div>
        <div class="filters">
            <div class="row">
                <label>Max price<input type="range" id="maxPrice" min="1500" max="7000" step="100" value="7000"><span id="priceVal">$7,000</span></label>
                <label>Area<select id="areaFilter">
        <option value="all">All areas</option>
        <option value="no-si">All except SI</option>
        <option value="brooklyn">Brooklyn</option>
        <option value="queens">Queens</option>
        <option value="bk-q">Brooklyn + Queens</option>
        <option value="coastal">Coastal/CNJ</option>
        <option value="li">Long Island</option>
        <option value="westchester">Westchester</option>
        <option value="nj-north">NJ North</option>
        <option value="si">Staten Island</option>
      </select></label>
            </div>
            <div class="row">
                <label>Min friendliness<input type="range" id="minFriendly" min="1" max="5" step="0.5" value="1"><span id="friendlyVal">1+</span></label>
            </div>
            <div class="checks">
                <label><input type="checkbox" id="directOnly"> Direct only</label>
                <label><input type="checkbox" id="storageOnly"> Has storage</label>
            </div>
        </div>
        <div class="weights-panel">
            <div class="weights-toggle" onclick="document.getElementById('weightsBody').classList.toggle('open');this.querySelector('.arrow').textContent=document.getElementById('weightsBody').classList.contains('open')?'▾':'▸'">
                <span>⚖️ Score weights</span><span class="arrow">▸</span>
            </div>
            <div id="weightsBody" class="weights-body">
                <div class="weight-row"><span class="w-label">💰 Price</span><button class="weight-btn" onclick="adjWeight('price',-1)">−</button><span class="w-val" id="w-price">1</span><button class="weight-btn" onclick="adjWeight('price',1)">+</button><div class="weight-bar"><div class="weight-bar-fill" id="wb-price" style="width:20%"></div></div></div>
                <div class="weight-row"><span class="w-label">📐 Sqft</span><button class="weight-btn" onclick="adjWeight('sqft',-1)">−</button><span class="w-val" id="w-sqft">1</span><button class="weight-btn" onclick="adjWeight('sqft',1)">+</button><div class="weight-bar"><div class="weight-bar-fill" id="wb-sqft" style="width:20%"></div></div></div>
                <div class="weight-row"><span class="w-label">📦 Storage</span><button class="weight-btn" onclick="adjWeight('storage',-1)">−</button><span class="w-val" id="w-storage">1</span><button class="weight-btn" onclick="adjWeight('storage',1)">+</button><div class="weight-bar"><div class="weight-bar-fill" id="wb-storage" style="width:20%"></div></div></div>
                <div class="weight-row"><span class="w-label">🏳️‍⚧️ Safe</span><button class="weight-btn" onclick="adjWeight('friendly',-1)">−</button><span class="w-val" id="w-friendly">1</span><button class="weight-btn" onclick="adjWeight('friendly',1)">+</button><div class="weight-bar"><div class="weight-bar-fill" id="wb-friendly" style="width:20%"></div></div></div>
                <div class="weight-row"><span class="w-label">→BK Dist</span><button class="weight-btn" onclick="adjWeight('distBK',-1)">−</button><span class="w-val" id="w-distBK">1</span><button class="weight-btn" onclick="adjWeight('distBK',1)">+</button><div class="weight-bar"><div class="weight-bar-fill" id="wb-distBK" style="width:20%"></div></div></div>
                <div class="weight-row"><span class="w-label">→AP Dist</span><button class="weight-btn" onclick="adjWeight('distAP',-1)">−</button><span class="w-val" id="w-distAP">1</span><button class="weight-btn" onclick="adjWeight('distAP',1)">+</button><div class="weight-bar"><div class="weight-bar-fill" id="wb-distAP" style="width:20%"></div></div></div>
                <div class="weights-reset" onclick="resetWeights()">reset to 1×</div>
            </div>
        </div>
        <div class="submit-box">
            <h4>📎 Submit a listing</h4>
            <input type="text" id="submitUrl" placeholder="Paste a Zillow/CL/Redfin link...">
            <input type="text" id="submitNote" placeholder="Notes (optional)">
            <button onclick="submitListing()">Add to tracker</button>
            <div class="submit-msg" id="submitMsg">✅ Saved!</div>
        </div>
        <div id="pendingSection"></div>
        <div class="filter-interest">
            <label><input type="checkbox" id="showHot" checked> 🔥</label>
            <label><input type="checkbox" id="showInterested" checked> 👀</label>
            <label><input type="checkbox" id="showMaybe" checked> 🤷</label>
            <label><input type="checkbox" id="showPass"> ❌</label>
            <label><input type="checkbox" id="showNew" checked> new</label>
        </div>
        <div class="sort-bar">
            <button class="sort-btn" data-sort="price">$ Price</button>
            <button class="sort-btn" data-sort="friendly">🏳️‍⚧️ Safe</button>
            <button class="sort-btn" data-sort="storage">📦 Storage</button>
            <button class="sort-btn" data-sort="travel_bk">→ BK</button>
            <button class="sort-btn" data-sort="travel_ap">→ AP</button>
            <button class="sort-btn" data-sort="midpoint">⚖ Balance</button>
            <button class="sort-btn" data-sort="combined">⭐ Score</button>
        </div>
        <div id="count"></div>
        <div id="cards"></div>
        <button class="export-btn" onclick="exportTracker()">Export tracker.txt</button>
    </div>

    <script>
        // Listings loaded dynamically from Google Sheet
        let listings = [];

        async function loadListings() {
            const LISTINGS_API = 'https://script.google.com/macros/s/AKfycbx00WHSUuUIjYxaB_Zmkr-B-d1mroVxAtaRnvG6_sU-Hp0GILUsjIBp5SKshyqUIzsPRQ/exec?action=listings';
            try {
                const r = await fetch(LISTINGS_API);
                const data = await r.json();
                if (Array.isArray(data)) {
                    listings = data.map(l => ({
                        ...l,
                        price: Number(l.price) || 0,
                        lat: Number(l.lat) || null,
                        lng: Number(l.lng) || null,
                        friendly: Number(l.friendly) || 3.5,
                        sqft: l.sqft ? Number(l.sqft) : null,
                        travel_bk: l.travel_bk ? Number(l.travel_bk) : null,
                        travel_ap: l.travel_ap ? Number(l.travel_ap) : null
                    }));
                    console.log(`Loaded ${listings.length} listings from Sheet`);
                } else {
                    console.error('Unexpected response:', data);
                    document.getElementById('count').textContent = 'Error loading listings from Google Sheet';
                }
            } catch (e) {
                console.error('Failed to load listings:', e);
                document.getElementById('count').textContent = 'Failed to load listings — check console';
            }
        }

        // Placeholder to start (will be populated by loadListings)
        const FALLBACK_LISTINGS = [];


        // Use fallback if Sheet load fails
        if (!listings.length) listings = FALLBACK_LISTINGS;

        const BEDSTUY = [40.6824, -73.9425];
        const ASBURY = [40.2201, -73.9973];

        const map = L.map('map').setView([40.62, -73.98], 10);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const targetIcon = (color) => L.divIcon({
            html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 0 8px ${color}"></div>`,
            className: '',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });
        L.marker(BEDSTUY, {
            icon: targetIcon('#ff1744')
        }).addTo(map).bindTooltip('Bed-Stuy (11213)');
        L.marker(ASBURY, {
            icon: targetIcon('#ffd600')
        }).addTo(map).bindTooltip('Asbury Park NJ');
        L.polyline([BEDSTUY, ASBURY], {
            color: '#fff',
            weight: 1.5,
            dashArray: '6,8',
            opacity: 0.25
        }).addTo(map);

        function friendlyColor(score) {
            if (score >= 4.5) return '#1b5e20';
            if (score >= 4) return '#2e7d32';
            if (score >= 3.5) return '#689f38';
            if (score >= 3) return '#f9a825';
            if (score >= 2.5) return '#e65100';
            return '#b71c1c';
        }

        function pinColor(l) {
            if (l.area === 'brooklyn' || l.area === 'queens') return '#e040fb';
            if (l.direct === 'yes') return '#00e676';
            if (l.source && l.source.includes('Allie')) return '#42a5f5';
            if (l.area === 'coastal') return '#00bcd4';
            return '#ffab40';
        }

        function createMarker(l) {
            if (!l.lat || !l.lng) return null;
            const color = pinColor(l);
            const fc = friendlyColor(l.friendly || 3);
            const size = l.direct === 'yes' ? 13 : 10;
            const icon = L.divIcon({
                html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2.5px solid ${fc};box-shadow:0 0 5px ${color}"></div>`,
                className: '',
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
            const m = L.marker([l.lat, l.lng], {
                icon
            });
            const fBadge = `<span style="background:${fc};color:#fff;padding:1px 5px;border-radius:8px;font-size:11px">${l.friendly||'?'}</span>`;
            m.bindPopup(`<b>${l.name}</b><br>$${l.price}/mo | ${l.bd||'?'} | ⭐ ${combinedScore(l).toFixed(1)}/5<br>Friendly: ${fBadge} ${l.sqft ? '| '+l.sqft+' sqft' : ''}<br>${l.storage||''}<br><a href="${l.url}" target="_blank">View listing →</a>`);
            return m;
        }

        // --- Tracker state (syncs with Google Sheets) ---
        // Per-user reactions: tracker[url][userName] = { interest, status, notes, updated_at }
        const SHEET_API = 'https://script.google.com/macros/s/AKfycbx00WHSUuUIjYxaB_Zmkr-B-d1mroVxAtaRnvG6_sU-Hp0GILUsjIBp5SKshyqUIzsPRQ/exec';
        const tracker = {};
        // tracker populated in init() after listings load

        // Helper: get current user's tracker entry for a URL
        function myTracker(url) {
            if (!tracker[url]) tracker[url] = {};
            if (!tracker[url][userName]) tracker[url][userName] = { interest:'new', status:'new', notes:'' };
            return tracker[url][userName];
        }

        // Helper: get all users' reactions for a URL
        function allReactions(url) { return tracker[url] || {}; }

        // Summarize who reacted with what interest
        function reactionSummary(url) {
            const r = allReactions(url);
            const byLevel = {};
            Object.entries(r).forEach(([user, data]) => {
                const lvl = data.interest || 'new';
                if (lvl === 'new') return; // don't show "new" as a reaction
                if (!byLevel[lvl]) byLevel[lvl] = [];
                byLevel[lvl].push(user);
            });
            const emoji = { hot:'🔥', interested:'👀', maybe:'🤷', pass:'❌' };
            return Object.entries(byLevel).map(([lvl, users]) =>
                `<span style="font-size:0.68em;color:#90caf9">${emoji[lvl]||lvl} ${users.join(', ')}</span>`
            ).join(' ');
        }

        // Ask for username on first visit
        let userName = '';
        try {
            userName = localStorage.getItem('rental_map_user') || '';
        } catch (e) {}
        if (!userName) {
            userName = prompt('Enter your name (so friends can see who marked what):') || 'anonymous';
            try {
                localStorage.setItem('rental_map_user', userName);
            } catch (e) {}
        }
        const userBadge = document.createElement('div');
        userBadge.style.cssText = 'position:fixed;top:8px;right:8px;z-index:9999;background:#1a1a2e;color:#90caf9;padding:4px 10px;border-radius:12px;font-size:12px;border:1px solid #334;cursor:pointer';
        userBadge.textContent = userName;
        userBadge.title = 'Click to change name';
        userBadge.onclick = () => {
            const n = prompt('Change your name:', userName);
            if (n) {
                userName = n;
                userBadge.textContent = n;
                try {
                    localStorage.setItem('rental_map_user', n);
                } catch (e) {}
            }
        };
        document.body.appendChild(userBadge);

        // Sync: load from Sheet on startup
        async function loadFromSheet() {
            if (!SHEET_API) return;
            try {
                const r = await fetch(SHEET_API);
                const data = await r.json();
                // data = { url: { user1: {interest,status,notes,...}, user2: {...} } }
                Object.keys(data).forEach(url => {
                    if (!tracker[url]) tracker[url] = {};
                    Object.entries(data[url]).forEach(([user, vals]) => {
                        tracker[url][user] = vals;
                    });
                });
                render();
                console.log('Loaded tracker from Google Sheet');
            } catch (e) {
                console.warn('Sheet load failed:', e);
            }
        }

        // Sync: save single change to Sheet (per-user)
        function saveToSheet(url, changes) {
            if (!SHEET_API) return;
            fetch(SHEET_API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: JSON.stringify({
                    url,
                    user: userName,
                    ...changes
                }),
                mode: 'no-cors'
            }).catch(e => console.warn('Sheet save failed:', e));
        }

        // --- Pending submissions (URLs not yet on the map) ---
        const pendingListings = [];

        function submitListing() {
          const urlEl = document.getElementById('submitUrl');
          const noteEl = document.getElementById('submitNote');
          const msgEl = document.getElementById('submitMsg');
          const url = urlEl.value.trim();
          if (!url) return;
          // Check if already tracked
          if (tracker[url] || listings.find(l => l.url === url)) {
            msgEl.textContent = '⚠️ Already tracked!'; msgEl.style.color = '#f9a825';
            msgEl.style.display = 'block'; setTimeout(() => msgEl.style.display = 'none', 2000);
            return;
          }
          // Try to extract a name from the URL
          let name = 'Pending listing';
          try {
            const parts = new URL(url).pathname.split('/').filter(Boolean);
            if (url.includes('zillow.com')) {
              const addr = parts.find(p => p.includes('-')) || parts[1] || '';
              name = addr.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            } else if (url.includes('craigslist.org')) {
              const slug = parts[parts.length - 1] || '';
              name = slug.replace('.html','').replace(/-/g,' ').substring(0,50);
            } else if (url.includes('redfin.com')) {
              name = parts.filter(p => !p.match(/^\d+$/) && p !== 'home').join(' ').replace(/-/g,' ');
            }
          } catch(e) {}
          const note = noteEl.value.trim();
          pendingListings.push({ url, name, note, submitted_by: userName, submitted_at: new Date().toISOString() });
          // Save to sheet
          saveToSheet(url, { interest: 'interested', status: 'new', notes: (note ? note + ' ' : '') + '[submitted]' });
          urlEl.value = ''; noteEl.value = '';
          msgEl.textContent = '✅ Saved!'; msgEl.style.color = '#4caf50';
          msgEl.style.display = 'block'; setTimeout(() => msgEl.style.display = 'none', 2500);
          renderPending();
        }

        function renderPending() {
          const el = document.getElementById('pendingSection');
          if (!pendingListings.length) { el.innerHTML = ''; return; }
          el.innerHTML = '<div style="color:#78909c;font-size:0.75em;margin:6px 0 4px">📎 Pending submissions (not yet on map)</div>' +
            pendingListings.map(p => `<div class="pending-card">
              <div class="name">${p.name}</div>
              <div class="meta">by ${p.submitted_by}${p.note ? ' — ' + p.note : ''}</div>
              <a href="${p.url}" target="_blank">View listing →</a>
            </div>`).join('');
        }

        // Also load pending items from sheet (URLs not in listings array)
        async function loadPendingFromSheet() {
          if (!SHEET_API) return;
          try {
            const r = await fetch(SHEET_API);
            const data = await r.json();
            const knownUrls = new Set(listings.map(l => l.url));
            Object.keys(data).forEach(url => {
              if (!knownUrls.has(url)) {
                // Find who submitted it (first user entry)
                const users = Object.entries(data[url]);
                const first = users[0] || ['?', {}];
                const allRemoved = users.every(([u,d]) => d.interest === 'removed');
                if (allRemoved) return;
                pendingListings.push({
                  url, name: url.split('/').filter(p => p.includes('-')).pop()?.replace(/-/g,' ')?.replace(/\b\w/g,c=>c.toUpperCase()) || 'Pending',
                  note: first[1].notes || '', submitted_by: first[0], submitted_at: first[1].updated_at || ''
                });
              }
            });
            renderPending();
          } catch(e) {}
        }

        function setInterest(url, level) {
            const my = myTracker(url);
            level = (my.interest === level) ? 'new' : level;
            my.interest = level;
            my.updated_at = new Date().toISOString();
            saveToSheet(url, { interest: level });
            render();
        }

        function setStatus(url, status) {
            const my = myTracker(url);
            my.status = status;
            my.updated_at = new Date().toISOString();
            saveToSheet(url, { status });
        }

        function setNotes(url, notes) {
            const my = myTracker(url);
            my.notes = notes;
            my.updated_at = new Date().toISOString();
            saveToSheet(url, { notes });
        }

        function exportTracker() {
            let lines = [
                '# Rental Tracker',
                '# ===============',
                '# Interest: hot | interested | maybe | pass | removed',
                '# Status:   new | contacted | viewed | applied | rejected | ghosted',
                '# Format: INTEREST | STATUS | NAME | PRICE | URL | NOTES',
                ''
            ];
            // Export uses current user's reactions
            lines.push('# === REMOVED ===');
            listings.forEach(l => {
                const t = myTracker(l.url);
                if (t.interest === 'pass') {
                    lines.push(`pass | ${t.status} | ${l.name} | $${l.price.toLocaleString()} | ${l.url} | ${t.notes}`);
                }
            });
            lines.push('');
            lines.push('# === ACTIVE ===');
            const order = ['hot', 'interested', 'maybe', 'new'];
            order.forEach(level => {
                listings.forEach(l => {
                    const t = myTracker(l.url);
                    if (t.interest === level) {
                        lines.push(`${level} | ${t.status} | ${l.name} | $${l.price.toLocaleString()} | ${l.url} | ${t.notes}`);
                    }
                });
            });
            const blob = new Blob([lines.join('\n')], {
                type: 'text/plain'
            });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'rental_tracker.txt';
            a.click();
        }

        const maxPriceEl = document.getElementById('maxPrice');
        const priceValEl = document.getElementById('priceVal');
        const areaEl = document.getElementById('areaFilter');
        const directEl = document.getElementById('directOnly');
        const storageEl = document.getElementById('storageOnly');
        const minFriendlyEl = document.getElementById('minFriendly');
        const friendlyValEl = document.getElementById('friendlyVal');
        const cardsEl = document.getElementById('cards');
        const countEl = document.getElementById('count');
        let currentSort = 'combined';

        const showHotEl = document.getElementById('showHot');
        const showIntEl = document.getElementById('showInterested');
        const showMaybeEl = document.getElementById('showMaybe');
        const showPassEl = document.getElementById('showPass');
        const showNewEl = document.getElementById('showNew');

        maxPriceEl.oninput = () => {
            priceValEl.textContent = `$${Number(maxPriceEl.value).toLocaleString()}`;
            render();
        };
        minFriendlyEl.oninput = () => {
            friendlyValEl.textContent = `${minFriendlyEl.value}+`;
            render();
        };
        areaEl.onchange = render;
        directEl.onchange = render;
        storageEl.onchange = render;
        showHotEl.onchange = render;
        showIntEl.onchange = render;
        showMaybeEl.onchange = render;
        showPassEl.onchange = render;
        showNewEl.onchange = render;

        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                render();
            };
        });

        function storageScore(l) {
            const s = (l.storage || '').toLowerCase();
            let score = 0;
            if (s.includes('2-car')) score += 5;
            else if (s.includes('garage')) score += 3;
            if (s.includes('basement')) score += 3;
            if (s.includes('finished')) score += 1;
            if (s.includes('attic')) score += 1;
            if (s.includes('shed')) score += 1;
            if (s.includes('yard') || s.includes('acre')) score += 1;
            return score;
        }
        // === SCORING SYSTEM ===
        const BEDSTUY_R = [40.6824, -73.9425];
        const ASBURY_R  = [40.2201, -73.9973];

        function haversine(lat1, lng1, lat2, lng2) {
            const R = 3958.8;
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLng = (lng2-lng1) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
            return R * 2 * Math.asin(Math.sqrt(a));
        }

        // Distances computed in init() after listings load

        // Score functions (all return 1-5, higher = better)
        function priceScore(p) {
            if (!p || p <= 0) return 3;
            if (p <= 2200) return 5;
            if (p <= 2800) return 4;
            if (p <= 3500) return 3;
            if (p <= 4300) return 2;
            return 1;
        }

        function sqftScore(sf) {
            if (!sf) return null; // unknown
            if (sf >= 2200) return 5;
            if (sf >= 1600) return 4;
            if (sf >= 1100) return 3;
            if (sf >= 750) return 2;
            return 1;
        }

        function storScore(l) {
            const s = storageScore(l);
            if (s >= 7) return 5;
            if (s >= 5) return 4;
            if (s >= 3) return 3;
            if (s >= 1) return 2;
            return 1;
        }

        function distScore(miles) {
            if (!miles) return 3;
            if (miles <= 5) return 5;
            if (miles <= 12) return 4;
            if (miles <= 22) return 3;
            if (miles <= 35) return 2;
            return 1;
        }

        // Dynamic weights (default all 1x)
        const weights = { price:1, sqft:1, storage:1, friendly:1, distBK:1, distAP:1 };

        function adjWeight(key, delta) {
            weights[key] = Math.max(0, Math.min(5, weights[key] + delta));
            document.getElementById('w-'+key).textContent = weights[key];
            const maxW = Math.max(1, ...Object.values(weights));
            Object.keys(weights).forEach(k => {
                document.getElementById('wb-'+k).style.width = (weights[k]/maxW*100)+'%';
            });
            // Rebuild markers (popup has score) and re-render cards
            listings.forEach(l => { if(l._marker) map.removeLayer(l._marker); l._marker = createMarker(l); });
            render();
        }

        function resetWeights() {
            Object.keys(weights).forEach(k => { weights[k] = 1; });
            Object.keys(weights).forEach(k => {
                document.getElementById('w-'+k).textContent = '1';
                document.getElementById('wb-'+k).style.width = '20%';
            });
            listings.forEach(l => { if(l._marker) map.removeLayer(l._marker); l._marker = createMarker(l); });
            render();
        }

        function combinedScore(l) {
            const ps = priceScore(l.price);
            const ss = sqftScore(l.sqft);
            const st = storScore(l);
            const fr = Math.min(5, Math.max(1, Math.round(l.friendly || 3)));
            const db = distScore(l._distBK);
            const da = distScore(l._distAP);

            let totalW = weights.price + weights.storage + weights.friendly + weights.distBK + weights.distAP;
            let totalS = weights.price*ps + weights.storage*st + weights.friendly*fr + weights.distBK*db + weights.distAP*da;
            if (ss !== null) {
                totalW += weights.sqft;
                totalS += weights.sqft*ss;
            }
            return totalW > 0 ? totalS / totalW : 0;
        }

        function scoreClass(s) {
            if (s >= 4) return 'good';
            if (s >= 3) return 'mid';
            return 'bad';
        }

        function scorePill(label, val) {
            if (val === null) return '<span class="score-pill">'+label+': ?</span>';
            return '<span class="score-pill '+scoreClass(val)+'">'+label+': '+val+'</span>';
        }

        // Markers created in init() after listings load



        function render() {
            const maxP = +maxPriceEl.value;
            const area = areaEl.value;
            const directOnly = directEl.checked;
            const storOnly = storageEl.checked;
            const minF = +minFriendlyEl.value;

            let filtered = listings.filter(l => {
                if (l.price > maxP) return false;
                if (area === 'no-si' && l.area === 'si') return false;
                else if (area === 'bk-q' && l.area !== 'brooklyn' && l.area !== 'queens') return false;
                else if (area !== 'all' && area !== 'no-si' && area !== 'bk-q' && l.area !== area) return false;
                if (directOnly && l.direct !== 'yes') return false;
                if (storOnly && storageScore(l) === 0) return false;
                if ((l.friendly || 0) < minF) return false;
                // Interest filter (based on current user's pick)
                const myInt = myTracker(l.url).interest || 'new';
                if (myInt === 'hot' && !showHotEl.checked) return false;
                if (myInt === 'interested' && !showIntEl.checked) return false;
                if (myInt === 'maybe' && !showMaybeEl.checked) return false;
                if (myInt === 'pass' && !showPassEl.checked) return false;
                if (myInt === 'new' && !showNewEl.checked) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (currentSort === 'price') return a.price - b.price;
                if (currentSort === 'friendly') return (b.friendly || 0) - (a.friendly || 0);
                if (currentSort === 'storage') return storageScore(b) - storageScore(a);
                if (currentSort === 'travel_bk') return (a.travel_bk || 99) - (b.travel_bk || 99);
                if (currentSort === 'travel_ap') return (a.travel_ap || 99) - (b.travel_ap || 99);
                if (currentSort === 'midpoint') return Math.abs((a.travel_bk || 99) - (a.travel_ap || 99)) - Math.abs((b.travel_bk || 99) - (b.travel_ap || 99));
                if (currentSort === 'combined') return combinedScore(b) - combinedScore(a);
                return 0;
            });

            listings.forEach(l => {
                if (l._marker) {
                    if (filtered.includes(l)) l._marker.addTo(map);
                    else map.removeLayer(l._marker);
                }
            });

            countEl.textContent = `Showing ${filtered.length} of ${listings.length} listings`;

            cardsEl.innerHTML = filtered.map(l => {
                        const cls = l.direct === 'yes' ? 'direct' : l.direct === 'no' ? 'broker' : 'unclear';
                        const tags = [];
                        if (l.direct === 'yes') tags.push('<span class="tag tag-direct">✅ direct</span>');
                        if (storageScore(l) >= 3) tags.push('<span class="tag tag-storage">📦 storage</span>');
                        const areaTagMap = {
                            si: '<span class="tag tag-si">SI</span>',
                            coastal: '<span class="tag tag-coastal">🌊 coastal</span>',
                            li: '<span class="tag tag-li">LI</span>',
                            'nj-north': '<span class="tag tag-nj">NJ</span>',
                            queens: '<span class="tag tag-queens">Queens</span>',
                            westchester: '<span class="tag tag-westchester">Westchester</span>',
                            brooklyn: '<span class="tag tag-brooklyn">Brooklyn</span>'
                        };
                        if (areaTagMap[l.area]) tags.push(areaTagMap[l.area]);

                        const travel = [];
                        if (l.travel_bk) travel.push(`BK:${l.travel_bk}m`);
                        if (l.travel_ap) travel.push(`AP:${l.travel_ap}m`);
                        const travelStr = travel.length ? ` | ${travel.join(', ')}` : '';

                        const fc = friendlyColor(l.friendly || 3);
                        const fText = (l.friendly || 0) >= 3 ? '#fff' : '#fff';

                        const tr = myTracker(l.url);
                        const curInt = tr.interest || 'new';
                        const passClass = curInt === 'pass' ? ' pass-card' : '';
                        const intBtn = (emoji, val) => `<button class="interest-btn${curInt===val?' active-'+val:''}" onclick="event.stopPropagation();setInterest('${l.url.replace(/'/g,"\\'")}','${val}')">${emoji}</button>`;
                        const reactions = reactionSummary(l.url);

                        return `<div class="card ${cls}${passClass}" onclick="flyTo(${l.lat},${l.lng})">
      <div class="friendly-badge" style="background:${friendlyColor(combinedScore(l))}" title="Combined score: ${combinedScore(l).toFixed(1)}/5"><span style="position:relative;z-index:1;color:#fff;text-shadow:0 0 4px rgba(0,0,0,0.8)">${combinedScore(l).toFixed(1)}</span></div>
      <div class="name">${l.name}</div>
      <div class="meta">$${l.price.toLocaleString()}/mo | ${l.bd || '?'}${travelStr}</div>
      ${l.storage ? `<div class="storage-line">${l.storage}</div>` : ''}
      <div class="tags">${tags.join('')}</div>
      <div class="scores-row">
        ${scorePill('💰', priceScore(l.price))}
        ${scorePill('📐', sqftScore(l.sqft))}
        ${scorePill('📦', storScore(l))}
        ${scorePill('🏳️‍⚧️', Math.round(l.friendly||3))}
        ${scorePill('→BK', distScore(l._distBK))}
        ${scorePill('→AP', distScore(l._distAP))}
      </div>
      <div class="interest-row">
        ${intBtn('🔥','hot')}${intBtn('👀','interested')}${intBtn('🤷','maybe')}${intBtn('❌','pass')}
        <select class="status-select" onclick="event.stopPropagation()" onchange="setStatus('${l.url.replace(/'/g,"\\'")}',this.value)">
          ${['new','contacted','viewed','applied','rejected','ghosted'].map(s => `<option value="${s}"${tr.status===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      ${reactions ? `<div style="margin-top:3px">${reactions}</div>` : ''}
      <input class="notes-input" type="text" placeholder="notes..." value="${(tr.notes||'').replace(/"/g,'&quot;')}" onclick="event.stopPropagation()" onchange="setNotes('${l.url.replace(/'/g,"\\'")}',this.value)">
      <a class="link" href="${l.url}" target="_blank" onclick="event.stopPropagation()">View listing →</a>
    </div>`;
  }).join('');
}

function flyTo(lat, lng) { if (lat && lng) map.flyTo([lat, lng], 14); }

areaEl.value = 'no-si';
        document.querySelector('[data-sort="combined"]').classList.add('active');

// === INIT: Load listings from Sheet, then render ===
async function init() {
    document.getElementById('count').textContent = 'Loading listings...';
    await loadListings();
    // Compute distances
    listings.forEach(l => {
        if (l.lat && l.lng) {
            l._distBK = haversine(l.lat, l.lng, ...BEDSTUY_R);
            l._distAP = haversine(l.lat, l.lng, ...ASBURY_R);
        }
    });
    // Init tracker
    listings.forEach(l => { tracker[l.url] = {}; });
    // Create markers
    listings.forEach(l => { l._marker = createMarker(l); });
    // Update subtitle
    document.querySelector('.subtitle').textContent = `${listings.length} listings | Live from Google Sheet`;
    // Render
    render();
    // Load reactions and pending submissions
    await loadFromSheet();
    await loadPendingFromSheet();
    render(); // re-render with reactions applied
}
init();
    </script>
